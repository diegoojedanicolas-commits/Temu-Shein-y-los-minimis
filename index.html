<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Temu, Shein y los minimis</title>
<style>
:root{--bg:#fff;--ink:#111;--muted:#6b6b6b;--line:#ececec;--red:#d0021b;color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:34px 22px 48px}
button{font:inherit;color:inherit;cursor:pointer}
h1{border-top:4px solid var(--red);padding-top:22px;font:700 30px/1.15 Georgia,"Times New Roman",serif;margin:0 0 8px}
h2{font:400 21px/1.2 Georgia,serif;margin:28px 0 10px}
.sub{color:var(--muted);margin:0 0 14px;font-size:15px;max-width:60ch}
svg{display:block;width:100%;height:auto}
.belt{margin:0 0 4px}.belt svg{border-radius:6px}
.bc{font-size:13px;color:var(--muted);margin:6px 0 10px}.bc b{color:var(--ink)}
.bx{animation:slide 18s linear infinite}
@keyframes slide{from{transform:translateX(-50px)}to{transform:translateX(690px)}}
.bt{stroke-dasharray:10 8;animation:bt 1s linear infinite}
@keyframes bt{to{stroke-dashoffset:-18}}
.pn{animation:fly 26s linear infinite}
@keyframes fly{from{transform:translateX(-70px)}to{transform:translateX(690px)}}
#ov{transition:opacity .6s}
.tabs{display:flex;border-bottom:1px solid #ccc;margin:14px 0 18px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:4px solid transparent;padding:10px 14px;font-weight:700;font-size:15px;margin-bottom:-1px;white-space:nowrap}
.tab[aria-pressed=true]{border-bottom-color:var(--red)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 20px;margin-bottom:12px;align-items:center}
.grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{background:#fff;border:1px solid var(--ink);border-radius:999px;padding:4px 13px;font-size:13px}
.pill[aria-pressed=true]{background:var(--ink);color:#fff}
.note{font-size:13px;color:var(--muted);margin:10px 0 0;max-width:62ch}.note b{color:var(--ink)}
.tg{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--red);border:1px solid var(--red);padding:0 6px;margin-right:6px;vertical-align:1px}
.big{font:400 46px/1 Georgia,serif;margin:4px 0}.big small{font-size:18px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center}
.rings svg{max-width:96px;margin:0 auto}.rings b{display:block;font-size:13px}.rings span{font-size:11px;color:var(--muted);line-height:1.3;display:block}
.rw{display:grid;grid-template-columns:minmax(110px,34%) 1fr;gap:12px;align-items:center;padding:6px 4px}
.rw .lb{font-size:13px;line-height:1.25}
.tr{position:relative;display:block;height:16px;background:#f4f4f4;border-radius:3px}
.fill{position:absolute;left:0;top:0;height:100%;width:0;border-radius:3px;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.v{position:absolute;top:0;font-size:12px;font-weight:700;line-height:16px;white-space:nowrap;transition:left .9s cubic-bezier(.2,.7,.2,1)}
.tags{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding-top:16px}
.pt{border:1px solid #ddd;border-radius:6px;padding:14px 8px 10px;text-align:center;position:relative;transform-origin:50% -16px;animation:swg 3.4s ease-in-out infinite}
.pt:nth-child(2){animation-delay:-1.1s}.pt:nth-child(3){animation-delay:-2.2s}
.pt:before{content:"";position:absolute;left:50%;top:-16px;height:16px;width:1px;background:#999}
.pt:after{content:"";position:absolute;left:50%;top:5px;width:7px;height:7px;margin-left:-3.5px;border:1px solid #bbb;border-radius:50%}
.pt span{font-size:12px;color:var(--muted);display:block;line-height:1.3;margin-top:6px}.pt b{font:400 24px Georgia,serif;color:var(--red)}
@keyframes swg{50%{transform:rotate(3deg)}25%,75%{transform:rotate(-3deg)}}
.cs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cs div{border-top:3px solid var(--ink);padding-top:8px;animation:rise .5s both}
.cs i{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;font:700 11px/1 Arial,sans-serif;align-items:center;justify-content:center;font-style:normal}
.fg{width:54px;height:auto;border:1px solid #ddd;display:block}
.cs span{display:block;font-size:13px;color:#333;margin-top:6px;line-height:1.4}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.toy{background:#f8f8f8;border-radius:4px;padding:14px 16px}
.toy input{width:100%;accent-color:var(--red);margin:6px 0}
.vc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vo{border:1px solid var(--line);border-radius:8px;padding:12px;transition:opacity .3s,transform .3s,border-color .3s;animation:rise .5s both}
.vo.d{opacity:.25;transform:scale(.98)}.vo:not(.d){border-color:var(--ink)}
.vo svg{width:46px;animation:bob 3.2s ease-in-out infinite}.vo h3{font:400 16px Georgia,serif;margin:6px 0 0}.vo small{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.vo p{font-size:13px;margin:0;color:#333;line-height:1.45}
@keyframes bob{50%{transform:translateY(-3px)}}
.dk{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.dc{background:none;border:1px solid var(--line);border-radius:8px;padding:10px 4px;text-align:center;font-size:12px;font-weight:700}
.dc[aria-pressed=true]{border-color:var(--red)}
.dc svg{width:44px;margin:0 auto 4px}
.sp{transform-box:fill-box;transform-origin:center;animation:spin 4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.wg{transform-box:fill-box;transform-origin:50% 0;animation:wig 1.6s ease-in-out infinite}@keyframes wig{0%,50%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%,40%{transform:rotate(-14deg)}}
.cl{stroke-dasharray:100;animation:cdn 3s linear infinite}@keyframes cdn{from{stroke-dashoffset:0}to{stroke-dashoffset:100}}
.dr{transform-box:fill-box;transform-origin:left;animation:drn 2.6s ease-in-out infinite}@keyframes drn{0%{transform:scaleX(1)}100%{transform:scaleX(.18)}}
.pu{animation:pls 3s infinite}.pu:nth-child(2){animation-delay:.75s}.pu:nth-child(3){animation-delay:1.5s}.pu:nth-child(4){animation-delay:2.25s}@keyframes pls{0%,100%{opacity:.25}25%{opacity:1}}
.dd{border-left:4px solid var(--red);background:#f8f8f8;padding:12px 16px;margin-top:12px;font-size:14px;min-height:72px}.dd b{display:block;font:400 19px Georgia,serif;margin-bottom:2px}
.src{margin-top:30px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
@media (max-width:560px){.two,.vc{grid-template-columns:1fr}.dk{grid-template-columns:repeat(5,1fr);gap:4px}.dc{font-size:10px}.tags,.cs{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.bx,.bt,.pn,.pt,.vo svg,.sp,.wg,.cl,.dr,.pu,.cs div,.vo{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Temu, Shein y los minimis</h1>
  <p class="sub">Los paquetes de menos de USD 200 que se compran en Temu o Shein entran a Colombia sin pagar impuestos.</p>
  <div class="belt">
    <svg viewBox="0 0 640 112" role="img" aria-label="Paquetes que llegan en avión y pasan por una aduana; con IVA, los paquetes se marcan con una franja roja">
      <defs><clipPath id="cp"><rect x="346" y="0" width="300" height="112"/></clipPath></defs>
      <rect width="640" height="112" fill="#fff"/>
      <g class="pn"><g transform="translate(0 3)"><path d="M4 8L1 0h8l10 8z" fill="#d0021b"/><path d="M2 10Q2 6 10 6H46Q58 7 62 10Q58 13 46 14H10Q2 14 2 10Z" fill="#111"/><path d="M26 11L17 20H27L44 11Z" fill="#444"/><ellipse cx="33" cy="16.5" rx="5" ry="2.2" fill="#111"/><circle cx="38" cy="9.6" r="1.4" fill="#fff"/><circle cx="43" cy="9.6" r="1.4" fill="#fff"/><circle cx="48" cy="9.6" r="1.4" fill="#fff"/><path d="M53 8.2Q57 8.4 59 10L53 10Z" fill="#fff"/></g></g>
      <text id="gl" x="320" y="29" text-anchor="middle" font-size="11" font-weight="700" fill="#111"></text>
      <rect y="84" width="640" height="18" fill="#1f1f1f"/><line class="bt" x1="0" x2="640" y1="88" y2="88" stroke="#555" stroke-width="2"/><rect y="102" width="640" height="4" fill="#ddd"/>
      <g id="px"></g>
      <g clip-path="url(#cp)"><g id="ov" style="opacity:0"></g></g>
      <rect x="296" y="36" width="6" height="48" fill="#111"/><rect x="338" y="36" width="6" height="48" fill="#111"/><rect x="292" y="32" width="56" height="9" fill="#111"/><text x="320" y="39" text-anchor="middle" font-size="6.5" font-weight="700" fill="#fff">ADUANA</text>
      <text x="8" y="76" font-size="10" fill="#6b6b6b">Exterior</text><text x="632" y="76" text-anchor="end" font-size="10" fill="#6b6b6b">Colombia</text>
    </svg>
    <p class="bc" id="bl"></p>
    <div class="grp"><button class="pill" data-iva="0" aria-pressed="true">Hoy: sin IVA bajo USD 200</button><button class="pill" data-iva="1" aria-pressed="false">Con el proyecto: IVA</button></div>
  </div>
  <div id="app"></div>
  <div class="src">Fuente: cifras del Ministerio de Hacienda citadas en el texto.</div>
</div>
<script>
(function(){
var $=id=>document.getElementById(id),app=$("app"),fm=n=>Math.round(n).toLocaleString("es-CO"),f1=n=>n.toFixed(1).replace(".",",");
var S={tab:"m",iva:0,price:100000,th:"all",dk:0};
var V=[
 ["Ponentes del proyecto","María José Pizarro y Olmes Echeverría de la Rosa","Eliminar los minimis: todo paquete comprado a una empresa del exterior pagaría IVA, salvo donde un tratado de comercio lo impida. Para ellos, las plataformas son ecosistemas logísticos y de marketing sofisticados, y la diferencia de precio es una «elusión tributaria sistémica».",["iva"],"#d0021b"],
 ["Centro comercial","Camilo Bohórquez, Multiplaza Bogotá","Las condiciones no son iguales, pero las medidas no deberían cerrar la puerta a las plataformas, porque afectaría a los consumidores. El comercio local compite con calidad, garantía, servicio postventa, asesoría e inmediatez.",["abr"],"#111111"],
 ["San Victorino","Yansen Estupiñán, Centro Comercial Neos","Ve a las plataformas como competidoras, no enemigas. Propone, además de nivelar impuestos, una plataforma subsidiada por el Estado (un «Temu colombiano») y menos impuestos y más capacitación en marketing digital para quienes venden por internet.",["est","dig","abr"],"#9a9a9a"],
 ["Academia","Docente de Negocios Internacionales, Areandina (Pereira)","Subir aranceles no basta: propone una estrategia integral con impuestos a las plataformas digitales, una DIAN con más personal y sistemas para el control aduanero, y mejoras de competitividad. Colombia debe ajustar los modelos de otros países, no replicarlos.",["iva","adu"],"#e58a93"]
];
var TH=[["all","Todas"],["iva","Cobrar IVA"],["adu","Control aduanero"],["dig","Digitalizar"],["est","Plataforma estatal"],["abr","No cerrar la puerta"]];
var DK=[
 ["Ruletas","Ruletas y juegos","Ruedas giratorias que recuerdan a las máquinas tragamonedas y prometen descuentos muy altos o productos a COP 0.",'<svg viewBox="0 0 48 48"><g class="sp"><circle cx="24" cy="26" r="17" fill="#fff" stroke="#111" stroke-width="2"/><path d="M24 26V9A17 17 0 0 1 38.7 17.5Z" fill="#d0021b"/><path d="M24 26l14.7-8.5A17 17 0 0 1 38.7 34.5Z" fill="#111"/><path d="M24 26l14.7 8.5A17 17 0 0 1 24 43Z" fill="#d0021b"/><path d="M24 26V43A17 17 0 0 1 9.3 34.5Z" fill="#111"/><path d="M24 26L9.3 34.5A17 17 0 0 1 9.3 17.5Z" fill="#d0021b"/><path d="M24 26L9.3 17.5A17 17 0 0 1 24 9Z" fill="#111"/></g><path d="M24 2l-4 8h8z" fill="#111"/></svg>'],
 ["Portada","Portada hecha a tu medida","La página principal se personaliza según las búsquedas e intereses, lo que eleva la probabilidad de recompra y la sensación de que todavía falta algo por comprar.",'<svg viewBox="0 0 48 48"><g fill="#111"><rect class="pu" x="6" y="6" width="16" height="16" rx="2"/><rect class="pu" x="26" y="6" width="16" height="16" rx="2"/><rect class="pu" x="26" y="26" width="16" height="16" rx="2"/><rect class="pu" x="6" y="26" width="16" height="16" rx="2"/></g></svg>'],
 ["Avisos","Notificaciones constantes","Mensajes frecuentes con promociones que vuelven a llevar al usuario a la aplicación.",'<svg viewBox="0 0 48 48"><g class="wg"><path d="M24 6c-8 0-12 6-12 14v8l-4 6h32l-4-6v-8c0-8-4-14-12-14zM20 38a4 4 0 0 0 8 0" fill="none" stroke="#111" stroke-width="2.4" stroke-linejoin="round"/></g><circle cx="35" cy="11" r="5" fill="#d0021b"/></svg>'],
 ["Reloj","Temporizadores","Cuando el usuario duda, aparecen cuentas regresivas que lo presionan a decidir rápido.",'<svg viewBox="0 0 48 48"><circle cx="24" cy="26" r="16" fill="none" stroke="#e6e6e6" stroke-width="4"/><circle class="cl" cx="24" cy="26" r="16" fill="none" stroke="#d0021b" stroke-width="4" pathLength="100" transform="rotate(-90 24 26)"/><path d="M24 26v-8" stroke="#111" stroke-width="2.4" stroke-linecap="round"/><rect x="20" y="3" width="8" height="4" fill="#111"/></svg>'],
 ["Escasez","«Quedan pocas unidades»","Avisos de baja disponibilidad que buscan acelerar la compra.",'<svg viewBox="0 0 48 48"><rect x="6" y="20" width="36" height="12" rx="3" fill="#eee"/><rect class="dr" x="7" y="21" width="34" height="10" rx="2" fill="#d0021b"/><text x="24" y="14" text-anchor="middle" font-size="8" font-weight="700" fill="#111">pocas</text></svg>']
];
var pill=(a,v,l,on)=>'<button class="pill" data-a="'+a+'" data-v="'+v+'" aria-pressed="'+on+'">'+l+"</button>";
var tab=(v,l)=>'<button class="tab" data-a="tab" data-v="'+v+'" aria-pressed="'+(S.tab===v)+'">'+l+"</button>";
var bar=(lb,w,c,t)=>'<div class="rw"><span class="lb">'+lb+'</span><span class="tr"><span class="fill" data-w="'+w+'" style="background:'+c+'"></span><span class="v" data-l="'+(w+1)+'" style="left:0">'+t+"</span></span></div>";
function belt(){
  var h="",o="";
  for(var k=0;k<8;k++){var t=k/8,st='style="animation-delay:-'+(t*18).toFixed(2)+"s;transform:translateX("+(-50+t*740).toFixed(0)+'px)"';
    h+='<g class="bx" '+st+'><rect y="58" width="34" height="26" rx="2" fill="#d4d4d4"/><rect x="14" y="58" width="6" height="26" fill="#fff" opacity=".6"/><rect y="58" width="34" height="26" rx="2" fill="none" stroke="#000" stroke-opacity=".22"/></g>';
    o+='<g class="bx" '+st+'><rect y="58" width="34" height="10" rx="2" fill="#d0021b"/><text x="17" y="65.5" text-anchor="middle" font-size="7" font-weight="700" fill="#fff">IVA</text></g>'}
  $("px").innerHTML=h;$("ov").innerHTML=o;setIva();
}
function setIva(){
  $("ov").style.opacity=S.iva?1:0;
  var g=$("gl");g.textContent=S.iva?"IVA del 19 % a cada paquete":"Sin impuestos: menos de USD 200";g.setAttribute("fill",S.iva?"#d0021b":"#111");
  $("bl").innerHTML=S.iva?"<b>Con el proyecto:</b> los paquetes comprados a empresas del exterior pagarían IVA, salvo donde los tratados de comercio lo impidan.":"<b>Hoy:</b> todo paquete de menos de USD 200 entra al país exento de impuestos (régimen de minimis).";
  document.querySelectorAll("[data-iva]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.iva===S.iva));
}
function cu(){
  document.querySelectorAll(".cu").forEach(el=>{
    var n=+el.dataset.n,t0=null;
    if(matchMedia("(prefers-reduced-motion:reduce)").matches){el.textContent=fm(n);return}
    (function s(t){if(t0===null)t0=t;var k=Math.min(1,(t-t0)/1300);el.textContent=fm(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(s)})(performance.now());
  });
}
function ring(p,t,d){return '<div><svg viewBox="0 0 90 90" role="img" aria-label="'+p+' % '+t+'"><circle cx="45" cy="45" r="36" fill="none" stroke="#eee" stroke-width="10"/><circle class="rg" data-d="'+p+'" cx="45" cy="45" r="36" fill="none" stroke="#d0021b" stroke-width="10" pathLength="100" transform="rotate(-90 45 45)" style="stroke-dasharray:0 100;transition:stroke-dasharray 1.2s cubic-bezier(.2,.7,.2,1)"/><text x="45" y="52" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="#111">'+p+' %</text></svg><b>'+t+"</b><span>"+d+"</span></div>"}
function problema(){
  var h='<div class="two"><div><div class="note" style="margin:0">Importaciones por minimis en 2024</div><div class="big"><small>USD </small><span class="cu" data-n="1552">0</span><small> millones</small></div><p class="note" style="margin-top:0">Cerca del 3 % de las compras externas del país, según el Ministerio de Hacienda.</p></div><div class="rings">'+ring(75,"de China","de los paquetes")+ring(60,"textiles","confecciones, calzado y accesorios")+"</div></div>";
  h+='<h2>Un crecimiento de 100 % en dos años</h2>'+bar("2022",43,"#bbb","≈ 776")+bar("2024",86,"#d0021b","1.552")+'<p class="note">El monto de 2024 es el doble del de 2022; la barra de 2022 es la mitad (USD millones).</p>';
  h+='<h2>Precios que llaman la atención</h2><div class="tags"><div class="pt"><b>$ 5.400</b><span>5 pares de medias</span></div><div class="pt"><b>$ 31.000</b><span>una camisa tipo polo</span></div><div class="pt"><b>$ 35.000</b><span>un conjunto de pijama</span></div></div><p class="note">Ejemplos de precios que explican el atractivo de Temu, Shein y AliExpress.</p>';
  h+='<h2>El impacto que cuentan los comerciantes</h2>'+bar("Antes (prendas al mes)",86,"#bbb","15.000")+bar("Ahora",17.2,"#d0021b","≈ 3.000")+'<p class="note">Es el testimonio de un líder de San Victorino sobre una famiempresa que surte a mayoristas: una caída de 80 %. No es una cifra del sector. El empresario Arturo Calle dijo ante la Comisión Tercera de la Cámara que ha despedido a unos 2.000 trabajadores por este impacto.</p>';
  return h;
}
function ivaBars(){
  var p=S.price,imp=p/1.19;
  $("pn").textContent="$ "+fm(p);
  $("ib").innerHTML=bar("Producto nacional (con IVA)",86,"#111","$ "+fm(p))+bar("Importado sin IVA",imp/p*86,"#d0021b","$ "+fm(imp))+'<p class="note" style="margin-top:8px">Si el precio nacional ya incluye el IVA de 19 %, quitarlo deja el producto importado en ≈ $ '+fm(imp)+': una diferencia de ≈ '+f1(100-100/1.19)+" %, no de 19 %.</p>";
  document.querySelectorAll("#ib .fill").forEach(e=>e.style.width=e.dataset.w+"%");document.querySelectorAll("#ib .v").forEach(e=>e.style.left=e.dataset.l+"%");
}
function flag(c){
  var s='<svg class="fg" viewBox="0 0 30 20" role="img" aria-label="Bandera de '+({us:"Estados Unidos",eu:"la Unión Europea",mx:"México"})[c]+'">',k;
  if(c==="us"){
    s+='<rect width="30" height="20" fill="#fff"/>';
    for(k=0;k<7;k++)s+='<rect y="'+(k*2*20/13).toFixed(2)+'" width="30" height="'+(20/13).toFixed(2)+'" fill="#b22234"/>';
    s+='<rect width="12" height="'+(7*20/13).toFixed(2)+'" fill="#3c3b6e"/>';
    for(k=0;k<12;k++)s+='<circle cx="'+(1.9+(k%4)*2.8).toFixed(1)+'" cy="'+(1.9+Math.floor(k/4)*3).toFixed(1)+'" r=".6" fill="#fff"/>';
  }else if(c==="eu"){
    s+='<rect width="30" height="20" fill="#003399"/>';
    for(k=0;k<12;k++){var a=k*Math.PI/6;s+='<circle cx="'+(15+6.5*Math.sin(a)).toFixed(2)+'" cy="'+(10-6.5*Math.cos(a)).toFixed(2)+'" r="1" fill="#ffcc00"/>'}
  }else{
    s+='<rect width="10" height="20" fill="#006847"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#ce1126"/><circle cx="15" cy="10" r="3" fill="#a9803c"/><circle cx="15" cy="10" r="1.8" fill="#6b8e3a"/>';
  }
  return s+'</svg>';
}
function iva(){
  var h='<div class="toy"><b>La brecha de precio por el IVA</b><br><label for="ps" style="font-size:13px">Precio de un producto nacional con IVA: <b id="pn"></b></label><input type="range" id="ps" min="10000" max="500000" step="5000" value="'+S.price+'"><div id="ib"></div></div>';
  h+='<p class="note">El proyecto de ley que se debate busca eliminar los minimis. Para sus ponentes, la diferencia de precio es una elusión tributaria que va contra el fomento de la industria nacional; cobrar el IVA «nivelaría» las condiciones de competencia.</p>';
  h+='<h2>Qué han hecho otros países</h2><div class="cs">'+[[flag("us"),"Estados Unidos","Suspendió por tiempo indefinido la exención para envíos de menos de USD 800."],[flag("eu"),"Unión Europea","Eliminó el beneficio para importaciones de menos de EUR 150."],[flag("mx"),"México","Retiró la medida para productos de países sin tratado comercial, como China."]].map((c,i)=>'<div style="animation-delay:'+i*.1+'s">'+c[0]+'<b style="display:block;font-size:13px;margin-top:6px">'+c[1]+"</b><span>"+c[2]+"</span></div>").join("")+"</div>";
  return h;
}
function avatar(c,i){return '<svg viewBox="0 0 48 52" aria-hidden="true" style="animation-delay:-'+i*.7+'s"><circle cx="24" cy="24" r="23" fill="#f5f5f5"/><circle cx="24" cy="18" r="8" fill="#e4e4e4"/><path d="M10 44c0-9 6-15 14-15s14 6 14 15z" fill="'+c+'"/><path d="M16 16c0-9 16-9 16 0-4-3-12-3-16 0z" fill="#111"/></svg>'}
function voces(){
  var h='<div class="ctl"><div class="grp">'+TH.map(t=>pill("th",t[0],t[1],S.th===t[0])).join("")+'</div></div><div class="vc">';
  V.forEach((v,i)=>{var ok=S.th==="all"||v[3].indexOf(S.th)>-1;h+='<div class="vo'+(ok?"":" d")+'" style="animation-delay:'+i*.08+'s">'+avatar(v[4],i)+'<h3>'+v[0]+"</h3><small>"+v[1]+"</small><p>"+v[2]+"</p></div>"});
  return h+'</div><p class="note">Competir con estas plataformas exige revisar impuestos y aranceles, pero también mejorar las condiciones del comercio colombiano: más digitalización y herramientas para competir en un mercado de variedad y precios bajos.</p>';
}
function diseno(){
  var d=DK[S.dk];
  return '<p class="note" style="margin:0 0 10px">La Unión Europea investiga si el diseño de Temu puede generar comportamientos compulsivos. Estos son los mecanismos que describen los expertos:</p><div class="dk">'+DK.map((x,i)=>'<button class="dc" data-a="dk" data-v="'+i+'" aria-pressed="'+(S.dk===i)+'">'+x[3]+x[0]+"</button>").join("")+'</div><div class="dd"><b>'+d[1]+"</b>"+d[2]+'</div><p class="note">Los expertos agrupan estas técnicas bajo el nombre de «patrón oscuro hiperactivo»: una interfaz diseñada para generar adicción, maximizar el tiempo conectado e inducir a interactuar de forma compulsiva.</p>';
}
function render(){
  app.innerHTML='<div class="tabs">'+tab("m","El problema")+tab("i","El IVA")+tab("v","Voces")+tab("d","Diseño adictivo")+"</div>"+({m:problema,i:iva,v:voces,d:diseno})[S.tab]();
  if(S.tab==="m")cu();
  if(S.tab==="i"){ivaBars();$("ps").oninput=function(){S.price=+this.value;ivaBars()}}
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    app.querySelectorAll(".fill[data-w]").forEach(e=>e.style.width=e.dataset.w+"%");
    app.querySelectorAll(".v[data-l]").forEach(e=>e.style.left=e.dataset.l+"%");
    app.querySelectorAll(".rg").forEach(e=>e.style.strokeDasharray=e.dataset.d+" 100");
  }));
}
document.addEventListener("click",e=>{
  var i=e.target.closest("[data-iva]");if(i){S.iva=+i.dataset.iva;setIva();return}
  var b=e.target.closest("[data-a]");if(!b)return;
  var a=b.dataset.a,v=b.dataset.v;
  if(a==="dk")S.dk=+v;else S[a==="tab"?"tab":a]=v;
  render();
});
belt();render();
})();
</script>
